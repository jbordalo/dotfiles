# ~/.tmux.conf

# Shell
set -g default-shell /usr/bin/fish

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Colors (truecolor + italics)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# Extended keys: lets Ctrl+Shift+arrows, Ctrl+Backspace etc. reach nvim
# (matches xterm-ghostty; needs tmux >= 3.2)
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Neovim-friendly
set -sg escape-time 10       # default 500ms makes <Esc> laggy in nvim
set -g focus-events on       # lets nvim detect focus (autoread, etc.)

# General
set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#T"

# Vi copy-mode
setw -g mode-keys vi
set -s set-clipboard on      # copy to system clipboard via OSC 52
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Start windows and panes at 1, keep numbering contiguous
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# New windows/panes open in the current directory
bind c new-window -c "#{pane_current_path}"
bind-key -n C-t new-window -c "#{pane_current_path}"

# Splits (| side by side, - stacked)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation with prefix + h/j/k/l (-r: repeatable without the prefix)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind Tab last-window         # `prefix l` (last window) is now taken

# Pane navigation (no prefix)
bind-key -n C-S-Up select-pane -U
bind-key -n C-S-Down select-pane -D
bind-key -n C-S-Left select-pane -L
bind-key -n C-S-Right select-pane -R
